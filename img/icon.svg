<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecd695"/><stop offset=".5" stop-color="#c9a24b"/><stop offset="1" stop-color="#7a5c26"/>
    </linearGradient>
    <radialGradient id="aether" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#d7f2ff"/><stop offset=".4" stop-color="#52c6ff"/><stop offset="1" stop-color="#0d4d84"/>
    </radialGradient>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0" stop-color="#1b1e2e"/><stop offset="1" stop-color="#090a11"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <g transform="translate(128,128) scale(1.12)">
    <!-- gear teeth -->
    <g fill="url(#brass)">
      <rect x="-6" y="-96" width="12" height="20" rx="3" transform="rotate(0)"/>
      <rect x="-6" y="-96" width="12" height="20" rx="3" transform="rotate(30)"/>
      <rect x="-6" y="-96" width="12" height="20" rx="3" transform="rotate(60)"/>
      <rect x="-6" y="-96" width="12" height="20" rx="3" transform="rotate(90)"/>
      <rect x="-6" y="-96" width="12" height="20" rx="3" transform="rotate(120)"/>
      <rect x="-6" y="-96" width="12" height="20" rx="3" transform="rotate(150)"/>
      <rect x="-6" y="-96" width="12" height="20" rx="3" transform="rotate(180)"/>
      <rect x="-6" y="-96" width="12" height="20" rx="3" transform="rotate(210)"/>
      <rect x="-6" y="-96" width="12" height="20" rx="3" transform="rotate(240)"/>
      <rect x="-6" y="-96" width="12" height="20" rx="3" transform="rotate(270)"/>
      <rect x="-6" y="-96" width="12" height="20" rx="3" transform="rotate(300)"/>
      <rect x="-6" y="-96" width="12" height="20" rx="3" transform="rotate(330)"/>
    </g>

    <circle r="76" fill="none" stroke="url(#brass)" stroke-width="9"/>
    <circle r="60" fill="#0b0c13" stroke="#2a2110" stroke-width="2"/>
    <circle r="50" fill="none" stroke="#52c6ff" stroke-width="1.6" opacity=".5"/>

    <!-- rune ticks -->
    <g stroke="#bfe9ff" stroke-width="2.6" opacity=".65" stroke-linecap="round">
      <line x1="0" y1="-56" x2="0" y2="-48" transform="rotate(0)"/>
      <line x1="0" y1="-56" x2="0" y2="-48" transform="rotate(45)"/>
      <line x1="0" y1="-56" x2="0" y2="-48" transform="rotate(90)"/>
      <line x1="0" y1="-56" x2="0" y2="-48" transform="rotate(135)"/>
      <line x1="0" y1="-56" x2="0" y2="-48" transform="rotate(180)"/>
      <line x1="0" y1="-56" x2="0" y2="-48" transform="rotate(225)"/>
      <line x1="0" y1="-56" x2="0" y2="-48" transform="rotate(270)"/>
      <line x1="0" y1="-56" x2="0" y2="-48" transform="rotate(315)"/>
    </g>

    <!-- aether crystal core (soft halo faked with a translucent disc — no filters) -->
    <circle r="30" fill="#52c6ff" opacity=".20"/>
    <polygon points="0,-34 21,-2 0,38 -21,-2" fill="url(#aether)" stroke="#cdeeff" stroke-width="1.8"/>
    <polygon points="0,-34 0,38 -21,-2" fill="#08243c" opacity=".38"/>
  </g>
</svg>
